<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Betöltő képernyő */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-logo {
            width: 80px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(0, 206, 158, 0.4));
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #00CE9E;
            box-shadow: 0 0 8px rgba(0, 206, 158, 0.6);
            border-radius: 2px;
        }

        /* Weboldal tartalma háttérképpel */
        #content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('hatter.png') no-repeat center center / cover;
            position: relative;
        }

        #content.show {
            display: block;
            opacity: 1;
        }

        /* Bal felső sarok (Logo + Domain) */
        .top-left-brand {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .top-left-brand img {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(0, 206, 158, 0.5));
        }

        .top-left-brand span {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* JOBB FELSŐ SAROK - MENÜPONTOK EGYMÁS MELLETT */
        .top-right-nav {
            position: absolute;
            top: 35px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            z-index: 10;
        }

        .nav-link {
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            position: relative;
            padding-bottom: 4px;
        }

        .nav-link:hover {
            color: #00CE9E;
            text-shadow: 0 0 10px rgba(0, 206, 158, 0.8);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #00CE9E;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 206, 158, 0.8);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 20px;
                left: 20px;
            }
            .top-right-nav {
                top: 25px;
                right: 20px;
                gap: 15px;
            }
            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Loading képernyő -->
    <div id="loader">
        <img src="logo.png" alt="Logo" class="loader-logo">
        <div class="progress-bar">
            <div class="progress-fill" id="fill"></div>
        </div>
    </div>

    <!-- Weboldal tartalma -->
    <div id="content">
        <!-- Bal felső sarok -->
        <div class="top-left-brand">
            <img src="logo.png" alt="RiseMTA Logo">
            <span>risemta.hu</span>
        </div>

        <!-- Jobb felső sarok: Tisztán a 3 menüpont egymás mellett -->
        <div class="top-right-nav">
            <a href="szabalyzat.html" class="nav-link">Szerver Szabályzat</a>
            <a href="dcszabalyzat.html" class="nav-link">Discord Szabályzat</a>
            <a href="#" class="nav-link">UCP</a>
        </div>
    </div>

    <script>
        let progress = 0;
        const fill = document.getElementById('fill');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');

        const interval = setInterval(() => {
            progress += 1;
            fill.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        document.body.style.overflow = 'auto';
                        content.classList.add('show');
                    }, 500);
                }, 100);
            }
        }, 25);
    </script>

</body>
</html>
