<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Betöltő képernyő */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(0, 206, 158, 0.4));
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #00CE9E;
            box-shadow: 0 0 8px rgba(0, 206, 158, 0.6);
            border-radius: 2px;
        }

        /* Weboldal tartalma */
        #content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            padding: 40px;
            text-align: center;
        }

        #content.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Loading képernyő -->
    <div id="loader">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="progress-bar">
            <div class="progress-fill" id="fill"></div>
        </div>
    </div>

    <!-- Ide jön a weboldal tartalma -->
    <div id="content">
        <h1>Üdvözlünk a RiseMTA oldalán!</h1>
        <p>A weboldal sikeresen betöltött.</p>
    </div>

    <script>
        let progress = 0;
        const fill = document.getElementById('fill');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');

        // Egyenletes, sima töltés megállás nélkül (kb. 2.5 másodperc)
        const interval = setInterval(() => {
            progress += 1;
            fill.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                
                // Amint eléri a 100%-ot, elhalványul és megjeleníti az oldalt
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        document.body.style.overflow = 'auto';
                        content.classList.add('show');
                    }, 500);
                }, 100);
            }
        }, 25);
    </script>

</body>
</html>
