<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Betöltő képernyő */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader-logo {
            width: 80px;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(0, 206, 158, 0.4));
        }

        .progress-bar {
            width: 200px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #00CE9E;
            box-shadow: 0 0 8px rgba(0, 206, 158, 0.6);
            border-radius: 2px;
        }

        /* Weboldal tartalma háttérképpel */
        #content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('hatter.png') no-repeat center center / cover;
            padding: 40px;
            position: relative;
        }

        #content.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        /* Bal felső sarok sáv (Logo + Domain) */
        .top-left-brand {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .top-left-brand img {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(0, 206, 158, 0.5));
        }

        .top-left-brand span {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 950px;
            width: 100%;
            margin-top: 140px; /* Éppen a RISECITY felirat alá tolja a kártyákat */
        }

        .cards-grid {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 250px;
            max-width: 290px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(0, 206, 158, 0.2);
            border-radius: 12px;
            padding: 35px 25px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #00CE9E;
            box-shadow: 0 8px 25px rgba(0, 206, 158, 0.3);
            background: rgba(20, 20, 20, 0.95);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #00CE9E;
        }

        .card p {
            font-size: 0.85rem;
            color: #b0b0b0;
            font-weight: 500;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 20px;
                left: 20px;
            }
            .main-container {
                margin-top: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading képernyő -->
    <div id="loader">
        <img src="logo.png" alt="Logo" class="loader-logo">
        <div class="progress-bar">
            <div class="progress-fill" id="fill"></div>
        </div>
    </div>

    <!-- Weboldal tartalma -->
    <div id="content">
        <!-- Bal felső sarok -->
        <div class="top-left-brand">
            <img src="logo.png" alt="RiseMTA Logo">
            <span>risemta.hu</span>
        </div>

        <!-- RISECITY alá igazított kártyák -->
        <div class="main-container">
            <div class="cards-grid">
                <a href="#" class="card">
                    <h2>Szerver Szabályzat</h2>
                    <p>Olvasd el a szerver alapvető viselkedési és RP szabályait.</p>
                </a>
                
                <a href="#" class="card">
                    <h2>Discord Szabályzat</h2>
                    <p>Ismerd meg a közösségi Discord szerverünk szabályait.</p>
                </a>
                
                <a href="#" class="card">
                    <h2>UCP</h2>
                    <p>Jelentkezz be a felhasználói fiókodba és kezeld a karaktered.</p>
                </a>
            </div>
        </div>
    </div>

    <script>
        let progress = 0;
        const fill = document.getElementById('fill');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');

        const interval = setInterval(() => {
            progress += 1;
            fill.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        document.body.style.overflow = 'auto';
                        content.classList.add('show');
                    }, 500);
                }, 100);
            }
        }, 25);
    </script>

</body>
</html>
