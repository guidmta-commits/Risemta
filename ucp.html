<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA - UCP Bejelentkezés</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('hatter.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Bal felső sarok: Vissza a főoldalra */
        .top-left-brand {
            position: fixed;
            top: 25px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            background: rgba(15, 15, 15, 0.85);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 206, 158, 0.2);
            backdrop-filter: blur(8px);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .top-left-brand:hover {
            border-color: #00CE9E;
            box-shadow: 0 0 15px rgba(0, 206, 158, 0.3);
        }

        .top-left-brand img {
            width: 35px;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0, 206, 158, 0.5));
        }

        .top-left-brand span {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* Fő login konténer */
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Logó és felirat a doboz felett */
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header img {
            width: 65px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(0, 206, 158, 0.6));
        }

        .login-header h2 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #dcdcdc;
            text-transform: uppercase;
        }

        /* Sötét login doboz */
        .login-box {
            background: rgba(18, 22, 20, 0.92);
            border: 1px solid rgba(0, 206, 158, 0.25);
            border-radius: 6px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.2);
        }

        .input-group svg {
            width: 20px;
            height: 20px;
            fill: #999999;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #777777;
        }

        /* Gombok stílusa */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .btn-login {
            background: rgba(35, 42, 39, 0.9);
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-login:hover {
            background: rgba(0, 206, 158, 0.2);
            color: #00CE9E;
        }

        .btn-login svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn-register {
            background: rgba(25, 30, 28, 0.9);
            color: #cccccc;
        }

        .btn-register:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 15px;
                left: 15px;
            }
            .login-wrapper {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Vissza a főoldalra gomb bal felül -->
    <a href="index.html" class="top-left-brand" title="Vissza a főoldalra">
        <img src="logo.png" alt="RiseMTA Logo">
        <span>risemta.hu</span>
    </a>

    <div class="login-wrapper">
        <!-- Fenti logó és felirat -->
        <div class="login-header">
            <img src="logo.png" alt="Rise Logo">
            <h2>RISEMTA OFFICIAL</h2>
        </div>

        <!-- Bejelentkező panel doboz -->
        <div class="login-box">
            <!-- Felhasználónév mező -->
            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" placeholder="Felhasználónév" required>
            </div>

            <!-- Jelszó mező -->
            <div class="input-group" style="border-bottom: none;">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" placeholder="Jelszó" required>
            </div>

            <!-- Bejelentkezés gomb -->
            <button class="btn btn-login" onclick="alert('Bejelentkezés funkció hamarosan!')">
                <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7v3zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
                Bejelentkezés
            </button>

            <!-- Regisztráció gomb -->
            <button class="btn btn-register" onclick="alert('Regisztráció funkció hamarosan!')">
                + Regisztráció
            </button>
        </div>
    </div>

</body>
</html>
