<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA - UCP Bejelentkezés</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            /* UCP specifikus háttérkép: ucp.hatter.png, sötétített, modern lila-kék/sötét tónusú alappal */
            background: linear-gradient(rgba(10, 10, 25, 0.85), rgba(15, 10, 30, 0.85)), url('ucp.hatter.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Bal felső sarok: Vissza a főoldalra */
        .top-left-brand {
            position: fixed;
            top: 25px;
            left: 35px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            background: rgba(15, 15, 25, 0.85);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(8px);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .top-left-brand:hover {
            border-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.4);
        }

        .top-left-brand img {
            width: 35px;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(138, 43, 226, 0.6));
        }

        .top-left-brand span {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* Modern, elegáns, átlátszó login kártya középre igazítva */
        .login-card {
            background: rgba(18, 18, 30, 0.75);
            border: 1px solid rgba(138, 43, 226, 0.25);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logó és felirat a panel tetején */
        .login-logo {
            width: 60px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(138, 43, 226, 0.7));
        }

        .login-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            color: #e0e0e0;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Input mezők konténer */
        .input-container {
            width: 100%;
            background: rgba(10, 10, 18, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-group:last-child {
            border-bottom: none;
        }

        .input-group svg {
            width: 20px;
            height: 20px;
            fill: #a0a0c0;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .input-group input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #707090;
        }

        /* Modern lila-kék bejelentkezés gomb */
        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.35);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.5);
            transform: translateY(-1px);
        }

        .btn-login svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 15px;
                left: 15px;
            }
            .login-card {
                max-width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Bal felső sarok: Vissza a főoldalra -->
    <a href="index.html" class="top-left-brand" title="Vissza a főoldalra">
        <img src="logo.png" alt="RiseMTA Logo">
        <span>risemta.hu</span>
    </a>

    <!-- Középre igazított, elegáns bejelentkezési panel -->
    <div class="login-card">
        <img src="logo.png" alt="Rise Logo" class="login-logo">
        <div class="login-title">RISEMTA UCP</div>

        <div class="input-container">
            <!-- Felhasználónév mező -->
            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" placeholder="Felhasználónév" required>
            </div>

            <!-- Jelszó mező -->
            <div class="input-group">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" placeholder="Jelszó" required>
            </div>
        </div>

        <!-- Bejelentkezés gomb -->
        <button class="btn-login" onclick="alert('Bejelentkezés funkció hamarosan!')">
            <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v3H3v4h7v3zM19 3H5c-1.1 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            Bejelentkezés
        </button>
    </div>

</body>
</html>
