<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA - UCP Bejelentkezés</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('hatter.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Bal felső sarok (Vissza a főoldalra) */
        .top-left-brand {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            text-decoration: none;
        }

        .top-left-brand img {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(0, 206, 158, 0.5));
        }

        .top-left-brand span {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* Középső bejelentkező felület */
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(15, 18, 17, 0.85);
            border: 1px solid rgba(0, 206, 158, 0.25);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-logo {
            width: 60px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(0, 206, 158, 0.6));
        }

        .login-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00CE9E;
            box-shadow: 0 0 10px rgba(0, 206, 158, 0.3);
        }

        .input-group input::placeholder {
            color: #777777;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #00CE9E;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 206, 158, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #00b58a;
            box-shadow: 0 0 20px rgba(0, 206, 158, 0.6);
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 20px;
                left: 20px;
            }
            .login-card {
                max-width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="top-left-brand">
        <img src="logo.png" alt="RiseMTA Logo">
        <span>risemta.hu</span>
    </a>

    <div class="main-container">
        <div class="login-card">
            <img src="logo.png" alt="RiseMTA Logo" class="login-logo">
            <div class="login-title">RiseMTA UCP</div>

            <div class="input-group">
                <input type="text" placeholder="Felhasználónév" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Jelszó" required>
            </div>

            <button class="btn-login" onclick="alert('Bejelentkezés hamarosan!')">Bejelentkezés</button>
        </div>
    </div>

</body>
</html>
