<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiseMTA - UCP Bejelentkezés</title>
    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Az egész oldal háttere sötétszürke */
            background-color: #111413;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Bal felső sarok (Vissza a főoldalra) */
        .top-left-brand {
            position: absolute;
            top: 30px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .top-left-brand img {
            width: 45px;
            height: auto;
            filter: drop-shadow(0 0 8px rgba(0, 206, 158, 0.5));
        }

        .top-left-brand span {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: lowercase;
        }

        /* Középső konténer semmilyen háttérdoboz nélkül */
        .login-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        /* Címsor és alcím felül */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 0.9rem;
            color: #888888;
            line-height: 1.4;
        }

        /* Input csoportok felirattal */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #1a1e1d;
            border: 1px solid #2a302e;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00CE9E;
            box-shadow: 0 0 10px rgba(0, 206, 158, 0.3);
        }

        .input-group input::placeholder {
            color: #555555;
        }

        /* Bejelentkezés gomb */
        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-login:hover {
            background-color: #00CE9E;
            box-shadow: 0 0 20px rgba(0, 206, 158, 0.6);
        }

        @media (max-width: 768px) {
            .top-left-brand {
                top: 20px;
                left: 20px;
            }
            .login-container {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Vissza a főoldalra gomb bal felül -->
    <a href="index.html" class="top-left-brand">
        <img src="logo.png" alt="RiseMTA Logo">
        <span>risemta.hu</span>
    </a>

    <!-- Bejelentkezési felület háttérdoboz nélkül, közvetlenül a szürke háttéren -->
    <div class="login-container">
        <div class="login-header">
            <h1>Bejelentkezés</h1>
            <p>Add meg az adataid, melyekkel<br>InGame regisztráltál.</p>
        </div>

        <div class="input-group">
            <label>Felhasználónév</label>
            <input type="text" placeholder="" required>
        </div>

        <div class="input-group">
            <label>Jelszó</label>
            <input type="password" placeholder="" required>
        </div>

        <button class="btn-login" onclick="alert('Bejelentkezés hamarosan!')">
            → Bejelentkezés
        </button>
    </div>

</body>
</html>
